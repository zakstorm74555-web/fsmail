<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message — FsMail Control Board</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col antialiased overflow-hidden select-none">

    <header class="bg-slate-900 border-b border-slate-800/60 px-6 py-4 flex items-center justify-between shadow-md relative z-20 shrink-0">
        <div class="flex items-center gap-3">
            <img src="icon.png" alt="FsMail" class="w-5 h-5 object-contain">
            <h1 class="text-sm font-bold text-slate-200 tracking-tight">FsMail Console</h1>
            <span class="bg-blue-500/10 text-blue-400 text-[9px] font-mono px-2 py-0.5 border border-blue-500/20 rounded-md font-semibold tracking-wider uppercase">View Mode</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-meta" class="text-xs font-mono text-slate-300 bg-slate-950 px-4 py-2 border border-slate-800/80 rounded-xl shadow-inner">...</span>
            <button onclick="clearSession()" class="text-xs bg-slate-800 border border-slate-700/60 px-4 py-2 rounded-xl font-medium text-slate-300 hover:bg-red-950/40 hover:text-red-400 transition duration-150">Disconnect</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <nav class="w-64 bg-slate-900/10 border-r border-slate-800/50 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-1.5">
                <button onclick="window.location.href='mail.html'" class="w-full py-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl text-xs font-bold uppercase tracking-wider transition duration-150 mb-5 active:scale-95">
                    &larr; Back to Inbox
                </button>
                <button onclick="window.location.href='mail.html'" class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Inbox</button>
                <button onclick="window.location.href='sendmail.html'" class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Compose</button>
            </div>

            <div class="border-t border-slate-900 pt-4 mt-auto">
                <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-2 px-1">FsMail Console</div>
                <div id="fsmail-inline-console" class="bg-slate-950 border border-slate-900 rounded-xl p-3 h-24 overflow-y-auto font-mono text-[10px] text-slate-400 leading-normal select-text space-y-0.5">
                    <p class="text-slate-600">[i] Standing by for secure tracking stream logs...</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 bg-slate-950 p-8 overflow-y-auto">
            <div class="max-w-4xl w-full bg-slate-900/20 border border-slate-900/80 p-8 rounded-2xl shadow-xl space-y-6 mx-auto">
                
                <div class="border-b border-slate-900 pb-5">
                    <h2 id="view-subject" class="text-xl font-bold text-slate-100 tracking-tight select-text">Loading message header...</h2>
                </div>

                <div class="bg-slate-950/60 p-5 rounded-xl border border-slate-800/80 flex justify-between items-center text-xs font-mono">
                    <div class="flex items-center gap-4">
                        <div id="view-profile-badge" class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-cyan-500 text-white flex items-center justify-center text-sm font-bold font-mono tracking-wide shadow-md shadow-blue-600/10 select-none shrink-0">
                            ?
                        </div>
                        <div class="space-y-1">
                            <p class="text-slate-300">
                                <span class="text-slate-600 font-medium font-sans">From:</span> 
                                <span id="view-from-name" class="font-bold text-slate-100 font-sans">...</span> 
                                <span id="view-from-email" class="text-blue-400 select-text font-medium ml-1">...</span>
                            </p>
                            <p class="text-slate-500">
                                <span class="text-slate-600 font-medium font-sans">To:</span> 
                                <span id="view-to" class="select-text font-medium">...</span>
                            </p>
                        </div>
                    </div>
                    <div id="view-meta-time" class="text-slate-500 font-medium bg-slate-950 border border-slate-900/60 px-3 py-1.5 rounded-lg shadow-inner">...</div>
                </div>

                <div id="view-body" class="text-slate-300 text-sm whitespace-pre-wrap leading-relaxed min-h-[18rem] font-sans border border-slate-900/80 p-6 rounded-xl bg-slate-950/30 shadow-inner select-text">
                    Loading core text content...
                </div>

                <div class="border-t border-slate-900 pt-5">
                    <button onclick="initReplyRoute()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl tracking-wider uppercase transition-all duration-150 shadow-md shadow-blue-600/10 active:scale-95">
                        Reply
                    </button>
                </div>

            </div>
        </main>

        <div id="toast-matrix-holder" class="absolute top-6 right-6 z-50 space-y-2 pointer-events-none max-w-sm w-full"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        window.onload = () => {
            if (typeof inspectMailPayload === 'function') {
                inspectMailPayload();
            }
        };
    </script>
</body>
</html>
