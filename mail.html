<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox — FsMail Control Board</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col antialiased overflow-hidden select-none">

    <header class="bg-slate-900 border-b border-slate-800/60 px-6 py-4 flex items-center justify-between shadow-md relative z-20 shrink-0">
        <div class="flex items-center gap-3">
            <img src="icon.png" alt="FsMail" class="w-5 h-5 object-contain">
            <h1 class="text-sm font-bold text-slate-200 tracking-tight">FsMail Console</h1>
            <span class="bg-blue-500/10 text-blue-400 text-[9px] font-mono px-2 py-0.5 border border-blue-500/20 rounded-md font-semibold tracking-wider uppercase">Live</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-meta" class="text-xs font-mono text-slate-300 bg-slate-950 px-4 py-2 border border-slate-800/80 rounded-xl shadow-inner">...</span>
            <button onclick="clearSession()" class="text-xs bg-slate-800 border border-slate-700/60 px-4 py-2 rounded-xl font-medium text-slate-300 hover:bg-red-950/40 hover:text-red-400 hover:border-red-900/40 transition duration-150 active:scale-95">Disconnect</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <nav class="w-64 bg-slate-900/10 border-r border-slate-800/50 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-1.5">
                <button onclick="window.location.href='sendmail.html'" class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-xs font-bold tracking-wider text-white uppercase mb-5 shadow-lg shadow-blue-600/10 transition-all duration-150 active:scale-[0.97]">
                    Compose
                </button>
                <button id="btn-inbox" onclick="switchFolder('inbox')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl transition-all flex justify-between items-center bg-slate-800 text-blue-400 border border-slate-700/30">Inbox</button>
                <button id="btn-allmail" onclick="switchFolder('allmail')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">All Mail</button>
                <button id="btn-spam" onclick="switchFolder('spam')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Spam</button>
                <button id="btn-snoozed" onclick="switchFolder('snoozed')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Snoozed</button>
                <button id="btn-sent" onclick="switchFolder('sent')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Sent</button>
                <button id="btn-important" onclick="switchFolder('important')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Important</button>
                <button id="btn-purchases" onclick="switchFolder('purchases')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Purchases</button>
                <button id="btn-promotions" onclick="switchFolder('promotions')", class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Promotions</button>
            </div>

            <div class="border-t border-slate-900 pt-4 mt-auto">
                <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-2 px-1">FsMail Console</div>
                <div id="fsmail-inline-console" class="bg-slate-950 border border-slate-900 rounded-xl p-3 h-24 overflow-y-auto font-mono text-[10px] text-slate-400 leading-normal select-text space-y-0.5">
                    <p class="text-slate-600">[i] Standing by for secure tracking stream logs...</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 bg-slate-950 overflow-y-auto">
            <div id="mail-stream" class="divide-y divide-slate-900/60">
                </div>
        </main>

        <div id="toast-matrix-holder" class="absolute top-6 right-6 z-50 space-y-2 pointer-events-none max-w-sm w-full"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        window.onload = () => {
            if (typeof fetchAndRenderMailbox === 'function') {
                fetchAndRenderMailbox('inbox');
            }
        };
        function switchFolder(folderName) {
            document.querySelectorAll('nav button').forEach(btn => {
                if(btn.id.startsWith('btn-')) {
                    btn.className = "w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition";
                }
            });
            const activeBtn = document.getElementById(`btn-${folderName}`);
            if(activeBtn) activeBtn.className = "w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl transition-all flex justify-between items-center bg-slate-900 border border-slate-800 text-blue-400";
            fetchAndRenderMailbox(folderName);
        }
    </script>
</body>
</html>
