<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose Message — FsMail Ecosystem</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased overflow-hidden select-none">

    <header class="bg-slate-900 border-b border-slate-800/80 px-6 py-3.5 flex items-center justify-between shadow-sm relative z-10">
        <div class="flex items-center gap-3">
            <img src="icon.png" alt="FsMail" class="w-5 h-5 object-contain">
            <h1 class="text-base font-bold text-slate-200 tracking-tight">FsMail</h1>
            <span class="bg-blue-500/10 text-blue-400 text-[10px] font-mono px-2 py-0.5 border border-blue-500/20 rounded font-medium">Outbound Node Controller</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-meta" class="text-xs font-mono text-slate-400 bg-slate-950 px-3 py-1.5 border border-slate-800 rounded-md">...</span>
            <button onclick="clearSession()" class="text-xs bg-slate-800 border border-slate-700 px-3 py-1.5 rounded font-medium hover:bg-red-950/40 hover:text-red-400 transition duration-150">Disconnect</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <nav class="w-56 bg-slate-900/20 border-r border-slate-800/60 p-3 flex flex-col justify-between">
            <div class="space-y-1">
                <button onclick="window.location.href='mail.html'" class="w-full py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded text-xs font-medium transition duration-150 mb-4">
                    &larr; Discard & Return
                </button>
                <button onclick="window.location.href='mail.html'" class="w-full text-left text-xs font-medium px-3 py-2 rounded text-slate-400 hover:bg-slate-900/60 hover:text-slate-200 transition">Inbox Stream</button>
            </div>

            <div class="border-t border-slate-900 pt-3 mt-auto">
                <div class="text-[10px] font-mono text-slate-600 uppercase tracking-widest mb-1.5 px-1">FsMail Console</div>
                <div id="fsmail-inline-console" class="bg-slate-950 border border-slate-900 rounded p-2 h-20 overflow-y-auto font-mono text-[9px] text-slate-400 leading-normal select-text">
                    <p class="text-slate-600">[i] Standing by for secure transmission tracking stream logs...</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 bg-slate-950 p-6 overflow-y-auto">
            <div class="max-w-3xl w-full bg-slate-900/40 border border-slate-900 p-6 rounded-lg shadow-xl mx-auto">
                
                <form onsubmit="executeOutboundTransmission(event)" class="space-y-4 text-sm">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1.5">Destination Coordinates (Gmail / Outlook / Any Real Domain)</label>
                        <input type="email" id="field-to" placeholder="recipient@domain.com" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white font-mono text-xs focus:outline-none focus:border-blue-500 transition select-text" required>
                    </div>

                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1.5">Subject classification header</label>
                            <input type="text" id="field-subject" placeholder="Enter message header context" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white text-xs focus:outline-none focus:border-blue-500 transition select-text" required>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1.5">Priority Classification</label>
                            <select id="field-type" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-400 text-xs focus:outline-none focus:border-blue-500 transition">
                                <option value="standard">Standard Packet</option>
                                <option value="important">Important Log</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wide mb-1.5">Text Cargo Payload Block</label>
                        <textarea id="field-body" rows="10" placeholder="Type your data transmission content layers here..." class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-white text-xs leading-relaxed focus:outline-none focus:border-blue-500 transition select-text" required></textarea>
                    </div>

                    <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold tracking-widest uppercase rounded transition duration-150 shadow-md shadow-blue-600/10">
                        Dispatch Outbound Transmission
                    </button>

                </form>

            </div>
        </main>

        <div id="toast-matrix-holder" class="absolute top-4 right-4 z-50 space-y-2 pointer-events-none max-w-sm w-full"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        window.onload = () => {
            const user = localStorage.getItem('fs_session_user') || "ghost@fatahshaheen.duckdns.org";
            if(document.getElementById('user-meta')) document.getElementById('user-meta').innerText = user;

            if (typeof checkPrepopulatedParams === 'function') {
                checkPrepopulatedParams();
            }
            if (typeof printFsLog === 'function') {
                printFsLog("Outbound cargo pipeline initialized and waiting for dispatch signature.", "info");
            }
        };
    </script>
</body>
</html>
