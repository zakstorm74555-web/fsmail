<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compose — FsMail Control Board</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col antialiased overflow-hidden select-none">

    <header class="bg-slate-900 border-b border-slate-800/60 px-6 py-4 flex items-center justify-between shadow-md relative z-20 shrink-0">
        <div class="flex items-center gap-3">
            <img src="icon.png" alt="FsMail" class="w-5 h-5 object-contain">
            <h1 class="text-sm font-bold text-slate-200 tracking-tight">FsMail Console</h1>
            <span class="bg-blue-500/10 text-blue-400 text-[9px] font-mono px-2 py-0.5 border border-blue-500/20 rounded-md font-semibold tracking-wider uppercase">Compose Mode</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="user-meta" class="text-xs font-mono text-slate-300 bg-slate-950 px-4 py-2 border border-slate-800/80 rounded-xl shadow-inner">...</span>
            <button onclick="clearSession()" class="text-xs bg-slate-800 border border-slate-700/60 px-4 py-2 rounded-xl font-medium text-slate-300 hover:bg-red-950/40 hover:text-red-400 transition duration-150">Disconnect</button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        
        <nav class="w-64 bg-slate-900/10 border-r border-slate-800/50 p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-1.5">
                <button onclick="window.location.href='mail.html'" class="w-full py-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl text-xs font-bold uppercase tracking-wider transition duration-150 mb-5 active:scale-95">
                    &larr; Discard & Return
                </button>
                <button onclick="window.location.href='mail.html'" class="w-full text-left text-xs font-medium px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-900/40 hover:text-slate-200 transition">Inbox</button>
            </div>

            <div class="border-t border-slate-900 pt-4 mt-auto">
                <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-2 px-1">FsMail Console</div>
                <div id="fsmail-inline-console" class="bg-slate-950 border border-slate-900 rounded-xl p-3 h-24 overflow-y-auto font-mono text-[10px] text-slate-400 leading-normal select-text space-y-0.5">
                    <p class="text-slate-600">[i] Standing by for secure tracking stream logs...</p>
                </div>
            </div>
        </nav>

        <main class="flex-1 bg-slate-950 p-8 overflow-y-auto">
            <div class="max-w-4xl w-full bg-slate-900/20 border border-slate-900/80 p-8 rounded-2xl shadow-xl mx-auto">
                
                <div class="border-b border-slate-900 pb-4 mb-6">
                    <h2 class="text-lg font-bold text-slate-200 tracking-tight">New Message</h2>
                </div>

                <form onsubmit="executeOutboundTransmission(event)" class="space-y-5 text-sm">
                    
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-2">To</label>
                        <input type="email" id="field-to" placeholder="recipient@domain.com" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-white font-mono text-xs focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 transition select-text" required>
                    </div>

                    <div class="grid grid-cols-3 gap-5">
                        <div class="col-span-2">
                            <label class="block text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-2">Subject</label>
                            <input type="text" id="field-subject" placeholder="Enter message subject" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-white text-xs focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 transition select-text" required>
                        </div>
                        <div>
                            <label class="block text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-2">Priority</label>
                            <select id="field-type" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-3 text-slate-400 text-xs focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 transition cursor-pointer">
                                <option value="standard">Standard Message</option>
                                <option value="important">Important Log</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 uppercase tracking-wider mb-2">Message Body</label>
                        <textarea id="field-body" rows="11" placeholder="Write your email content here..." class="w-full bg-slate-950/60 border border-slate-800 rounded-xl p-4 text-white text-xs leading-relaxed focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/20 transition select-text" required></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold tracking-widest uppercase rounded-xl transition-all duration-150 shadow-md shadow-blue-600/10 active:scale-[0.98]">
                            Send Message
                        </button>
                    </div>

                </form>

            </div>
        </main>

        <div id="toast-matrix-holder" class="absolute top-6 right-6 z-50 space-y-2 pointer-events-none max-w-sm w-full"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        window.onload = () => {
            const user = localStorage.getItem('fs_session_user') || "ghost@fsmail.duckdns.org";
            if(document.getElementById('user-meta')) document.getElementById('user-meta').innerText = user;

            if (typeof checkPrepopulatedParams === 'function') {
                checkPrepopulatedParams();
            }
            if (typeof printFsLog === 'function') {
                printFsLog("Outbound pipeline open. Awaiting message dispatch signature.", "info");
            }
        };
    </script>
</body>
</html>
